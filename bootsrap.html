        <!-- 
        warna di bootstrap 
        primary(biru)
        secondary(abu-abu)
        danger(merah)
        warning(kuninng)
        succes(hijau)
        info(biru muda)
        dark(hitam)-->  

        <button class="btn btn-danger rounded-pill">click me</button>    
        <button class="btn btn-warning rounded-pill">click me</button>    
        <button class="btn btn-success rounded-pill">click me</button>    
        <button class="btn btn-primary rounded-pill">click me</button>  
        <button class="btn btn-info rounded-pill">click me</button>
        <button class="btn btn-secondary rounded-pill">click me</button>
